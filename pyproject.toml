[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation system for codebase question answering"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "fire",
    "tqdm",
    "rank-bm25",
    "transformers",
    "torch",
    "accelerate>=1.15.0",
    "nltk>=3.10.4",
    "types-tqdm>=4.70.0.20260906",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
